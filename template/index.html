<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <title><%= htmlWebpackPlugin.options.title %></title>
        <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
        
        <style>
            /* Modern CSS Reset */
            *, *::before, *::after {
                box-sizing: border-box;
            }
            
            * {
                margin: 0;
                padding: 0;
            }
            
            html, body {
                height: 100%;
            }
            
            body {
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif, 'PingFang SC', 'Microsoft YaHei';
            }
            
            img, picture, video, canvas, svg {
                display: block;
                max-width: 100%;
            }
            
            input, button, textarea, select {
                font: inherit;
            }
            
            p, h1, h2, h3, h4, h5, h6 {
                overflow-wrap: break-word;
            }
            
            #root {
                isolation: isolate;
                height: 100%;
            }
            
            /* Modern loading spinner */
            .app-loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #f8fafc;
                padding: 20px;
            }
            
            .app-loading__spinner {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .app-loading__dot {
                width: 12px;
                height: 12px;
                background-color: #94a3b8;
                border-radius: 50%;
                margin: 0 4px;
                animation: bounce 1.5s infinite ease-in-out both;
            }
            
            .app-loading__dot:nth-child(1) {
                animation-delay: -0.32s;
            }
            
            .app-loading__dot:nth-child(2) {
                animation-delay: -0.16s;
            }
            
            @keyframes bounce {
                0%, 80%, 100% {
                    transform: scale(0);
                }
                40% {
                    transform: scale(1.0);
                }
            }
            
            /* Responsive design */
            @media (max-width: 768px) {
                .app-loading__dot {
                    width: 10px;
                    height: 10px;
                }
            }
            
            @media (max-width: 480px) {
                .app-loading__dot {
                    width: 8px;
                    height: 8px;
                }
            }
            
            /* No JavaScript fallback */
            .no-js {
                display: none;
                text-align: center;
                padding: 50px 20px;
                font-size: 16px;
                color: #64748b;
                background: #f8fafc;
            }
            
            noscript {
                display: block;
            }
            
            noscript .no-js {
                display: block;
            }
        </style>
    </head>
    <body>
        <noscript>
            <div class="no-js">
                <h2>需要启用JavaScript</h2>
                <p>请在浏览器设置中启用JavaScript以运行此应用程序。</p>
            </div>
        </noscript>
        
        <div id="root">
            <div class="app-loading">
                <div class="app-loading__spinner">
                    <div class="app-loading__dot"></div>
                    <div class="app-loading__dot"></div>
                    <div class="app-loading__dot"></div>
                </div>
            </div>
        </div>
    </body>
</html>
